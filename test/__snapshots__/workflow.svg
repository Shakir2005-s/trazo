<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 2136 536" role="img" aria-labelledby="t-title t-desc">
<title id="t-title">Purchase Request</title>
<desc id="t-desc">From a team&apos;s request to a paid vendor invoice.</desc>
<defs><marker id="t-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="t-arrow" d="M0 1L10 5L0 9z"/></marker></defs>
<style>
.t-text { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-kerning: none; font-variant-ligatures: none; font-feature-settings: "kern" 0, "liga" 0, "calt" 0; fill: var(--t-text, #1f2933); }
.t-group-title { fill: var(--t-muted, #52606d); }
.t-group-box { fill: var(--t-group-fill, #f5f7fa); stroke: var(--t-group-stroke, #cbd2d9); stroke-width: 1; }
.t-node-box { fill: var(--t-node-fill, #ffffff); stroke: var(--t-node-stroke, #9aa5b1); stroke-width: 1.25; }
.t-node:focus { outline: none; }
.t-node:focus-visible .t-node-box { stroke: var(--t-accent, #2f6fdb); stroke-width: 2.5; }
.t-icon { color: var(--t-icon, #52606d); }
.t-icon-database, .t-icon-storage, .t-icon-cache { color: var(--t-icon-data, #2f6f6f); }
.t-icon-client, .t-icon-user, .t-icon-external { color: var(--t-icon-edge, #8a5a2b); }
.t-edge { fill: none; stroke: var(--t-edge, #2f6fdb); stroke-width: 1.5; stroke-linejoin: round; }
.t-edge-async { stroke-dasharray: 7 5; }
.t-edge-data { stroke-dasharray: 1.5 4.5; stroke-linecap: round; }
.t-arrow { fill: var(--t-edge, #2f6fdb); }
.t-label-bg { fill: var(--t-bg, #ffffff); stroke: none; }
.t-label { fill: var(--t-muted, #52606d); }

.t-node-inner { fill: none; }
.t-node-rule { stroke: var(--t-node-stroke, #9aa5b1); stroke-width: 1.25; }
.t-lane-band { fill: var(--t-lane-fill, transparent); stroke: none; }
.t-lane-odd .t-lane-band { fill: var(--t-lane-fill-odd, rgba(120, 130, 145, 0.08)); }
.t-lane-header { fill: var(--t-lane-header, rgba(120, 130, 145, 0.12)); stroke: none; }
.t-lane-rule { stroke: var(--t-group-stroke, #cbd2d9); stroke-width: 1; }
.t-lane-title { fill: var(--t-muted, #52606d); }
</style>
<g class="t-lane" data-id="requester"><rect class="t-lane-band" x="0" y="0" width="2136" height="109"/><rect class="t-lane-header" x="0" y="0" width="100" height="109"/><line class="t-lane-rule" x1="0" y1="109" x2="2136" y2="109"/><text class="t-text t-lane-title" x="12" y="59" font-size="12" font-weight="600"><tspan x="12" dy="0">Requester</tspan></text></g>
<g class="t-lane t-lane-odd" data-id="procurement"><rect class="t-lane-band" x="0" y="109" width="2136" height="255"/><rect class="t-lane-header" x="0" y="109" width="100" height="255"/><line class="t-lane-rule" x1="0" y1="364" x2="2136" y2="364"/><text class="t-text t-lane-title" x="12" y="241" font-size="12" font-weight="600"><tspan x="12" dy="0">Procurement</tspan></text></g>
<g class="t-lane" data-id="finance"><rect class="t-lane-band" x="0" y="364" width="2136" height="172"/><rect class="t-lane-header" x="0" y="364" width="100" height="172"/><line class="t-lane-rule" x1="0" y1="536" x2="2136" y2="536"/><text class="t-text t-lane-title" x="12" y="454.5" font-size="12" font-weight="600"><tspan x="12" dy="0">Finance</tspan></text></g>
<path class="t-edge t-edge-sync" data-from="start" data-to="submit" d="M196 46 L297 46" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="submit" data-to="check" d="M441 46 L451 46 L451 186 L542 186" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="check" data-to="vendor" d="M688 186 L698 186 L698 302 L789 302" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="check" data-to="reject" d="M688 186 L802.5 186" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="reject" data-to="end" d="M947.5 186 L971 186 L971 52 L2040 52" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="vendor" data-to="order" d="M961 302 L981 302 L981 186 L1062 186" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="order" data-to="delivery" d="M1180 186 L1281 186" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-async" data-from="order" data-to="pay" d="M1180 193.5 L1190 193.5 L1190 449.5 L1549 449.5" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="delivery" data-to="pay" d="M1448 186 L1468 186 L1468 434.5 L1549 434.5" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="pay" data-to="paid" d="M1687 442 L1788 442" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="paid" data-to="pay" d="M1939 442 L1955 442 L1955 500 L1618 500 L1618 464" marker-end="url(#t-arrowhead)"/>
<path class="t-edge t-edge-sync" data-from="paid" data-to="end" d="M1939 442 L1949 442 L1949 40 L2040 40" marker-end="url(#t-arrowhead)"/>
<g class="t-edge-label" data-edge="e2"><rect class="t-label-bg" x="667" y="232" width="62" height="24" rx="3"/><text class="t-text t-label" x="698" y="248" font-size="12" font-weight="400" text-anchor="middle"><tspan x="698" dy="0">in budget</tspan></text></g>
<g class="t-edge-label" data-edge="e3"><rect class="t-label-bg" x="707" y="174" width="77" height="24" rx="3"/><text class="t-text t-label" x="745.5" y="190" font-size="12" font-weight="400" text-anchor="middle"><tspan x="745.5" dy="0">over budget</tspan></text></g>
<g class="t-edge-label" data-edge="e7"><rect class="t-label-bg" x="1345" y="437.5" width="49" height="24" rx="3"/><text class="t-text t-label" x="1369.5" y="453.5" font-size="12" font-weight="400" text-anchor="middle"><tspan x="1369.5" dy="0">invoice</tspan></text></g>
<g class="t-edge-label" data-edge="e10"><rect class="t-label-bg" x="1769" y="488" width="35" height="24" rx="3"/><text class="t-text t-label" x="1786.5" y="504" font-size="12" font-weight="400" text-anchor="middle"><tspan x="1786.5" dy="0">retry</tspan></text></g>
<g class="t-edge-label" data-edge="e11"><rect class="t-label-bg" x="1925.5" y="229" width="47" height="24" rx="3"/><text class="t-text t-label" x="1949" y="245" font-size="12" font-weight="400" text-anchor="middle"><tspan x="1949" dy="0">settled</tspan></text></g>
<g class="t-node t-shape-pill" data-id="start" data-kind="start" tabindex="0"><rect class="t-node-box" x="124" y="28" width="72" height="36" rx="18"/><text class="t-text t-node-label" x="160" y="50.5" font-size="13" font-weight="600" text-anchor="middle"><tspan x="160" dy="0">Start</tspan></text></g>
<g class="t-node" data-id="submit" data-kind="task" tabindex="0"><title>Item, quantity and cost center.</title><rect class="t-node-box" x="297" y="24" width="144" height="44" rx="8"/><text class="t-text t-node-label" x="369" y="51" font-size="14" font-weight="600" text-anchor="middle"><tspan x="369" dy="0">Submit request</tspan></text></g>
<g class="t-node t-shape-diamond" data-id="check" data-kind="decision" tabindex="0"><polygon class="t-node-box" points="615,149.5 688,186 615,222.5 542,186"/><text class="t-text t-node-label" x="615" y="190.5" font-size="13" font-weight="600" text-anchor="middle"><tspan x="615" dy="0">Within budget?</tspan></text></g>
<g class="t-node" data-id="reject" data-kind="task" tabindex="0"><rect class="t-node-box" x="802.5" y="164" width="145" height="44" rx="8"/><text class="t-text t-node-label" x="875" y="191" font-size="14" font-weight="600" text-anchor="middle"><tspan x="875" dy="0">Notify rejection</tspan></text></g>
<g class="t-node t-shape-subprocess" data-id="vendor" data-kind="subprocess" tabindex="0"><title>Skipped for vendors already approved.</title><rect class="t-node-box" x="789" y="280" width="172" height="44" rx="8"/><line class="t-node-rule" x1="797" y1="280" x2="797" y2="324"/><line class="t-node-rule" x1="953" y1="280" x2="953" y2="324"/><text class="t-text t-node-label" x="875" y="307" font-size="14" font-weight="600" text-anchor="middle"><tspan x="875" dy="0">Vendor onboarding</tspan></text></g>
<g class="t-node" data-id="order" data-kind="task" tabindex="0"><rect class="t-node-box" x="1062" y="164" width="118" height="44" rx="8"/><text class="t-text t-node-label" x="1121" y="191" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1121" dy="0">Place order</tspan></text></g>
<g class="t-node" data-id="delivery" data-kind="wait" tabindex="0"><rect class="t-node-box" x="1281" y="164" width="167" height="44" rx="8"/><svg class="t-icon t-icon-wait" x="1293" y="176" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg><text class="t-text t-node-label" x="1323" y="191" font-size="14" font-weight="600"><tspan x="1323" dy="0">Wait for delivery</tspan></text></g>
<g class="t-node" data-id="pay" data-kind="task" tabindex="0"><rect class="t-node-box" x="1549" y="420" width="138" height="44" rx="8"/><text class="t-text t-node-label" x="1618" y="447" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1618" dy="0">Send payment</tspan></text></g>
<g class="t-node t-shape-diamond" data-id="paid" data-kind="decision" tabindex="0"><polygon class="t-node-box" points="1863.5,404 1939,442 1863.5,480 1788,442"/><text class="t-text t-node-label" x="1863.5" y="446.5" font-size="13" font-weight="600" text-anchor="middle"><tspan x="1863.5" dy="0">Bank accepted?</tspan></text></g>
<g class="t-node t-shape-end" data-id="end" data-kind="end" tabindex="0"><rect class="t-node-box" x="2040" y="28" width="72" height="36" rx="18"/><rect class="t-node-box t-node-inner" x="2043" y="31" width="66" height="30" rx="15"/><text class="t-text t-node-label" x="2076" y="50.5" font-size="13" font-weight="600" text-anchor="middle"><tspan x="2076" dy="0">End</tspan></text></g>
</svg>